[project]
name = "poe2-crafting-mcp"
version = "0.1.0"
description = "PoE2 Crafting Advisor MCP Server"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Matthew Winnan", email = "mcwinnan@gmail.com"},
]

dependencies = [
    "lupa>=2.0",
    "mcp>=1.0",
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

local-llm = [
    "httpx>=0.27",
]

[project.scripts]
poe2-craft = "poe2_crafting_mcp.server:main"
pob-inspect = "poe2_crafting_mcp.engine.cli:main"
poe2-lookup = "poe2_crafting_mcp.data.lookup_cli:main"
poe2-price = "poe2_crafting_mcp.data.price_cli:main"

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poe2_crafting_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
